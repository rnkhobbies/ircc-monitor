# Cloudflare Pages configuration.
# wrangler picks this up automatically when `wrangler pages deploy` runs from
# this directory.

name = "ircc-monitor"
compatibility_date = "2024-09-25"
pages_build_output_dir = "./dist"

# Visit-counter storage. Pages Functions read/write this via env.VISITS.
[[kv_namespaces]]
binding = "VISITS"
id = "087d7dcd763446a690bd5f34d0c44ab4"
