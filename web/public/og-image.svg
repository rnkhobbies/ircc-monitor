<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f5f0"/>
      <stop offset="100%" stop-color="#efeadd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle red top stripe -->
  <rect x="0" y="0" width="1200" height="10" fill="#c8102e"/>

  <!-- Large maple leaf on the left -->
  <g transform="translate(150 175) scale(8.0)">
    <path
      fill="#c8102e"
      d="M16 2L17.5 6 21 4 20.5 9 25 7.5 23.5 12.5 28 13 23 16 26 21 20 20 19 24 17.5 23 17.5 28 14.5 28 14.5 23 13 24 12 20 6 21 9 16 4 13 8.5 12.5 7 7.5 11.5 9 11 4 14.5 6Z"
    />
  </g>

  <!-- Text block on the right -->
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="500" y="240" fill="#1a1a1a" font-size="68" font-weight="800" letter-spacing="-1.5">
      IRCC Monitor
    </text>
    <text x="500" y="305" fill="#555555" font-size="32" font-weight="500" letter-spacing="-0.5">
      Canadian citizenship — by the numbers
    </text>

    <text x="500" y="395" fill="#1a1a1a" font-size="26" font-weight="600">
      ⏱  Community wait times, by city
    </text>
    <text x="500" y="438" fill="#1a1a1a" font-size="26" font-weight="600">
      ✓  500-question practice test bank
    </text>
    <text x="500" y="481" fill="#1a1a1a" font-size="26" font-weight="600">
      📘  Every answer cited to Discover Canada
    </text>

    <text x="500" y="555" fill="#888888" font-size="20" font-weight="500">
      irccmonitor.ca · independent, open-source data
    </text>
  </g>
</svg>
